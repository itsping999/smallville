<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Smallville Village Badge Background -->
  <rect width="32" height="32" rx="7" fill="#132a1e"/>
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#1b3d2b" stroke="#2d6648" stroke-width="1"/>

  <!-- Chimney & Smoke -->
  <rect x="20" y="7" width="3" height="5" fill="#495057"/>
  <rect x="19" y="6" width="5" height="1" fill="#6c757d"/>
  <!-- Smoke puffs -->
  <circle cx="21" cy="4" r="1.2" fill="#e9ecef" opacity="0.8"/>
  <circle cx="23" cy="2" r="1.5" fill="#ffffff" opacity="0.9"/>

  <!-- Roof (Warm Red Tile) -->
  <polygon points="15.5,8 6,15 25,15" fill="#e76f51"/>
  <!-- Roof Overhang / Shading -->
  <polygon points="15.5,8 15.5,15 25,15" fill="#d95a3c"/>
  <rect x="6" y="14.5" width="19" height="1.5" fill="#9c3620" rx="0.5"/>

  <!-- Cottage Wall -->
  <rect x="8" y="16" width="15" height="10" fill="#f4ecd8"/>
  <rect x="19" y="16" width="4" height="10" fill="#e5d8be"/>
  <!-- Timber Beams -->
  <rect x="8" y="16" width="1.5" height="10" fill="#a0714f"/>
  <rect x="21.5" y="16" width="1.5" height="10" fill="#8c5e3c"/>

  <!-- Warm Illuminated Window -->
  <rect x="10.5" y="18" width="4" height="4" rx="0.5" fill="#ffb703"/>
  <rect x="10.5" y="18" width="1.5" height="1.5" fill="#fff3b0"/>
  <line x1="12.5" y1="18" x2="12.5" y2="22" stroke="#d48b00" stroke-width="0.6"/>
  <line x1="10.5" y1="20" x2="14.5" y2="20" stroke="#d48b00" stroke-width="0.6"/>

  <!-- Cottage Door -->
  <path d="M16.5,26 v-6 a1.5,1.5 0 0 1 3,0 v6 z" fill="#7f4f24"/>
  <circle cx="18.8" cy="23" r="0.4" fill="#ffd166"/>

  <!-- Garden Bush / Tree -->
  <circle cx="24" cy="23" r="3" fill="#2d6a4f"/>
  <circle cx="23.5" cy="22" r="2.2" fill="#40916c"/>
  <circle cx="25" cy="21.5" r="1.8" fill="#52b788"/>

  <!-- Lush Ground Tile -->
  <rect x="4" y="26" width="24" height="2" rx="1" fill="#2d6a4f"/>
  <rect x="6" y="27" width="20" height="1.5" rx="0.75" fill="#1b4332"/>
</svg>
